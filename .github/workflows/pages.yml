# The website: site/ at the root and this commit's web build at /play.
# Built on main only, when something it ships changes (the one thing that runs
# on a push to main), and by hand. Check it with tools/site_build.sh before
# pushing. It is deployed only once the owner has gone live:
#   1. Settings > Pages > Source: GitHub Actions
#   2. the repository variable SITE_LIVE set to true

name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - main.gd
      - main.tscn
      - project.godot
      - export_presets.cfg
      - icon.png
      - tools/itch_export.sh
      - tools/site_build.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # the editor and the web templates only, not the 1.3 GB of them all
      - name: Cache Godot and its web templates
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            godot.zip
            webtpl
          key: godot-4.7-stable-linux-web

      - name: Download Godot + web templates
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o "$RUNNER_TEMP/templates.tpz" https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p webtpl
          unzip -q -o -j "$RUNNER_TEMP/templates.tpz" templates/version.txt templates/web_nothreads_debug.zip templates/web_nothreads_release.zip -d webtpl

      - name: Save them, from main only
        if: ${{ steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            godot.zip
            webtpl
          key: godot-4.7-stable-linux-web

      - name: Install them
        run: |
          set -euo pipefail
          unzip -q -o godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          mv webtpl/* ~/.local/share/godot/export_templates/4.7.stable/

      - name: Build
        run: GODOT="$PWD/Godot_v4.7-stable_linux.x86_64" bash tools/site_build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && vars.SITE_LIVE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # one deploy at a time, and never cancel one halfway
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # the upload can finish a moment before GitHub lists it, so try twice
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before trying the deploy again
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 20

      - id: retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
