# Build the AAB and APK, signed with a throwaway key made for this run: no
# secrets, nothing published. The APK artifact installs on a tablet by hand.
# Runs by hand, or on a version tag: not on pull requests.

name: Android build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # the runner has an SDK already; the action's default packages
      # include "tools", which the SDK no longer has
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Download Godot + export templates
        run: |
          set -euo pipefail
          if [ ! -s godot.zip ]; then
            curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          fi
          if [ ! -s templates.tpz ]; then
            curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          fi
          unzip -q -o godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          mkdir -p "$RUNNER_TEMP/tpl" ~/.local/share/godot/export_templates/4.7.stable
          unzip -q -o templates.tpz -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP"/tpl/templates/* ~/.local/share/godot/export_templates/4.7.stable/

      - name: Import
        run: ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import

      - name: Export with a throwaway key
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/throwaway.keystore"
          export ANDROID_KEY_ALIAS=throwaway
          ANDROID_KEY_PASSWORD="$(openssl rand -hex 16)"
          export ANDROID_KEY_PASSWORD
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=throwaway" \
            -storepass:env ANDROID_KEY_PASSWORD -keypass:env ANDROID_KEY_PASSWORD
          GODOT="$PWD/Godot_v4.7-stable_linux.x86_64" TAG=v0.1 ALLOW_PLACEHOLDER_ID=1 bash tools/android_export.sh
          # the preset is put back as it was
          git diff --exit-code export_presets.cfg

      # what ships, rather than what the preset says
      - name: The APK's SDK levels and permissions
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging build/android/EatPreyNap.apk > "$RUNNER_TEMP/badging.txt"
          grep -E "^(package|minSdk|sdkVersion|targetSdk|uses-permission)" "$RUNNER_TEMP/badging.txt"
          grep -qE "^(minSdkVersion|sdkVersion):'24'" "$RUNNER_TEMP/badging.txt"
          grep -q "^targetSdkVersion:'36'" "$RUNNER_TEMP/badging.txt"
          if grep -q "android.permission.INTERNET" "$RUNNER_TEMP/badging.txt"; then
            echo "The APK asks for internet access"
            exit 1
          fi

      - name: Keep the APK to install by hand
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/EatPreyNap.apk
          retention-days: 2
